<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Chat App Project by EMMAN</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
        <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"> 
        </script>
        <script src="/socket.io/socket.io.js"></script>
        <style>
            body{
                margin-top: 30px;
            }
            
            .well{
                background-color: #f5f5f5;
                border: 1px solid #e3e3e3;
                border-radius: 4px;
                padding: 19px;
                margin-bottom: 20px;
            }
        </style>
    </head>
    <body>
        <div class="container">

            <!-- NEW FEATURE: join screen, shown first -->
            <div class="row" id="userFormArea">
                <div class="col-md-12">
                    <div class="well">
                        <form id="userForm">
                            <div class="form-group">
                                <label> Enter a username </label>
                                <input class="form-control" id="username">
                                <div class="text-danger" id="userError"></div>
                            </div> <br>
                            <input type="Submit" class="btn btn-primary" value="Join Chat">
                        </form>
                    </div>
                </div>
            </div>

            <!-- Your original chat layout, hidden until a username is accepted -->
            <div class="row" id="messageArea" style="display:none;">
                <div class="col-md-4">
                    <div class="well">
                        <h3>Active Users</h3>
                        <ul class="list-group" id="users"></ul>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="Chat ID" id="chat"></div>
                    <form id = "MessageForm">
                        <div class ="form-group">
                            <label> Enter a message </label>
                            <textarea class="form-control" id="message"></textarea>
                        </div> <br>
                        <input type="Submit" class="btn btn-primary" value="Send Message">
                    </form>
                </div>
            </div>
        </div>
        <script>
            $(function(){
                var socket = io();
                var $messageform = $('#MessageForm');
                var $message = $('#message');
                var $chat = $('#chat');
                // NEW FEATURE: elements for joining and for the users list
                var $userForm = $('#userForm');
                var $username = $('#username');
                var $users = $('#users');

                $messageform.submit(function(e){
                    e.preventDefault();
                    socket.emit('Send Message', $message.val());
                    $message.val('');
                    console.log('Message sent');
                });
                socket.on('New Message', function(data){
                    // .text() is used so nobody can slip HTML into the chat
                    var $well = $('<div class="well"></div>');
                    $well.append($('<strong></strong>').text(data.user + ': '));
                    $well.append(document.createTextNode(data.msg));
                    $chat.append($well);
                });

                // NEW FEATURE: join with a username
                $userForm.submit(function(e){
                    e.preventDefault();
                    socket.emit('New User', $username.val(), function(ok){
                        if(ok){
                            $('#userFormArea').hide();
                            $('#messageArea').show();
                        } else {
                            $('#userError').text('That name is empty or already taken.');
                        }
                    });
                    $username.val('');
                });

                // NEW FEATURE: redraw the Active Users list whenever it changes
                socket.on('Get Users', function(data){
                    $users.empty();
                    for(var i = 0; i < data.length; i++){
                        $users.append($('<li class="list-group-item"></li>').text(data[i]));
                    }
                });
            });
        </script>
    </body>
</html>
